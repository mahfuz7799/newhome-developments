<html lang="en">
<head>
<meta charset="utf-8">

<title>NewHome Developments | Property Development in Malta</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--primary:#14171a;--accent:#c9a46a;--accent-ink:#14171a;--goldtext:#8a6a2f;--bg:#fff;--surface:#f7f3ec;--text:#1f2326;--muted:#5d6166;--line:#e6dfd2;--on-primary:#fdf6ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#f3ead9;--accent:#d4b074;--goldtext:#d4b074;--bg:#0f1112;--surface:#171a1b;--text:#ebe7df;--muted:#a8a69f;--line:#2b2e30;--on-primary:#0f1112}}
:root[data-theme="dark"]{--primary:#f3ead9;--accent:#d4b074;--goldtext:#d4b074;--bg:#0f1112;--surface:#171a1b;--text:#ebe7df;--muted:#a8a69f;--line:#2b2e30;--on-primary:#0f1112}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;color:var(--primary);line-height:1.2;margin:0 0 .6em}
h1{font-size:clamp(2rem,5vw,3.4rem)}h2{font-size:clamp(1.6rem,3.5vw,2.3rem)}h3{font-size:1.25rem}
a{color:var(--primary)}img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
section.block{padding:72px 0}.alt{background:var(--surface)}
.eyebrow{color:var(--goldtext);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;margin-bottom:.6rem}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:13px 26px;border-radius:6px;font-weight:600;text-decoration:none;border:0;cursor:pointer;font:inherit;font-weight:600;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.btn.ghost{background:transparent;border:2px solid var(--primary);color:var(--primary)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:#111314;border-bottom:1px solid #2a2a2a;padding-top:env(safe-area-inset-top,0px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--primary);font-family:'Playfair Display',serif;font-weight:700;font-size:1.1rem}
.logo i{width:38px;height:38px;border:2px dashed var(--accent);border-radius:8px;display:grid;place-items:center;font:600 .6rem Inter,sans-serif;color:var(--muted)}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0}
nav a{text-decoration:none;color:#f3ead9;font-weight:500;padding:6px 0;border-bottom:2px solid transparent}
nav a.on,nav a:hover{border-color:var(--accent)}
#menu{display:none;background:none;border:1px solid #444;border-radius:6px;padding:8px 12px;color:#f3ead9;font-size:1rem}
@media(max-width:720px){#menu{display:block}nav ul{display:none;position:absolute;left:0;right:0;top:100%;background:#111314;flex-direction:column;gap:0;border-bottom:1px solid #2a2a2a}nav ul.open{display:flex}nav li a{display:block;padding:14px 20px;border:0}}
.hero{background:linear-gradient(135deg,#111314 0%,#2b2417 100%);color:#fff;padding:96px 0}
.hero h1{color:#fff}.hero p{max-width:540px;font-size:1.1rem;opacity:.92}
.hero .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero img{border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
@media(max-width:820px){.hero .grid{grid-template-columns:1fr}.hero{padding:56px 0}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.12)}
.card .body{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}.card .body p{margin:0;color:var(--muted)}
.loc{color:var(--goldtext);font-weight:600;font-size:.9rem}
.card .btn{margin-top:auto;align-self:flex-start}
.ph-tag{display:inline-block;background:var(--surface);border:1px dashed var(--accent);color:var(--muted);font-size:.75rem;padding:2px 8px;border-radius:99px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding:40px 0}
.split img{border-radius:12px;width:100%}
@media(max-width:760px){.split{grid-template-columns:1fr;gap:20px}}
.tag{display:inline-block;padding:3px 12px;border-radius:99px;font-size:.78rem;font-weight:600;margin-bottom:10px;background:var(--primary);color:var(--on-primary)}
.tag.after{background:var(--accent);color:var(--accent-ink)}
.slider{position:relative;border-radius:12px;overflow:hidden;max-width:820px;margin:0 auto;user-select:none;aspect-ratio:16/9}
.slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slider .top{clip-path:inset(0 50% 0 0)}
.slider input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.slider .bar{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5);pointer-events:none}
.slider .bar::after{content:"\2194";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:26px}
ul.tick{list-style:none;padding:0;margin:0}ul.tick li{padding-left:28px;position:relative;margin-bottom:8px}
ul.tick li::before{content:"\2713";position:absolute;left:0;color:var(--accent);font-weight:700}
form{display:grid;gap:16px}label{font-weight:500;display:grid;gap:6px}
input,textarea{font:inherit;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);width:100%}
.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
footer{background:#111314;color:#f3ead9;padding:40px 0;margin-top:0}
footer a{color:#d4b074}.logo img{height:64px;width:64px;object-fit:cover;border-radius:6px}.hero .eyebrow{color:#d4b074}.about p{margin:0 0 1em}
.fgrid{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px}
.view{animation:fade .5s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.crumb{padding-top:24px;font-size:.9rem}
</style>

const SITE={name:"NewHome Developments",email:"hello@example.com"};
const PROJECTS=[
{slug:"project-one",title:"Project One (Placeholder)",location:"[Town, Location]",
 short:"[Short description of this development or refurbishment.]",
 overview:"[Overview: what the property was, what the brief was, and what was achieved.]",
 cover:null,main:null,
 before:{heading:"Before Refurbishment",text:"[Describe the original condition of this property.]",img:null},
 after:{heading:"After Refurbishment",text:"[Describe the completed project and finish.]",img:null},
 notes:{improvements:["[Improvement completed]","[Improvement completed]","[Improvement completed]"],features:["[Key feature]","[Key feature]"],benefits:"[Explain the value and benefits to the owner or buyer.]",services:["Refurbishment","Energy Performance Certificates (EPCs)","Engineers' reports"]}},
{slug:"project-two",title:"Project Two (Placeholder)",location:"[Town, Location]",
 short:"[Short description of this development or refurbishment.]",
 overview:"[Overview for project two. Replace with real details.]",
 cover:null,main:null,
 before:{heading:"Before Refurbishment",text:"[Original condition of project two.]",img:null},
 after:{heading:"After Refurbishment",text:"[Completed result of project two.]",img:null},
 notes:{improvements:["[Improvement completed]","[Improvement completed]"],features:["[Key feature]","[Key feature]"],benefits:"[Benefits for project two.]",services:["New residential developments, no agent fees","Engineers' reports"]}},
{slug:"project-three",title:"Project Three (Placeholder)",location:"[Town, Location]",
 short:"[Short description of this development or refurbishment.]",
 overview:"[Overview for project three. Replace with real details.]",
 cover:null,main:null,
 before:{heading:"Before Refurbishment",text:"[Original condition of project three.]",img:null},
 after:{heading:"After Refurbishment",text:"[Completed result of project three.]",img:null},
 notes:{improvements:["[Improvement completed]","[Improvement completed]"],features:["[Key feature]","[Key feature]"],benefits:"[Benefits for project three.]",services:["Refurbishment","Energy Performance Certificates (EPCs)"]}}
];
/* ========= end editable data ========= */
const ph=(t,c)=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><rect width="800" height="450" fill="${c}"/><path d="M0 330l180-120 140 90 160-150 320 200v100H0z" fill="rgba(255,255,255,.12)"/><text x="400" y="225" fill="#fff" font-family="sans-serif" font-size="26" text-anchor="middle">${t}</text><text x="400" y="262" fill="#fff" opacity=".7" font-family="sans-serif" font-size="16" text-anchor="middle">Placeholder image: replace later</text></svg>`);
const img=(v,l,c)=>v||ph(l,c);
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function cards(list){return `<div class="cards">${list.map(p=>`<article class="card" tabindex="0" data-go="${p.slug}"><img loading="lazy" src="${img(p.cover,p.title,'#3a3326')}" alt="Cover image for ${esc(p.title)}"><div class="body"><span class="loc">${esc(p.location)}</span><h3>${esc(p.title)}</h3><p>${esc(p.short)}</p><a class="btn" href="#/project/${p.slug}">View Project</a></div></article>`).join("")}</div>`}
const services=`<div class="services"><div class="panel"><h3>New Developments</h3><p>New residential properties direct from the developer, with no agent fees.</p></div><div class="panel"><h3>Energy Performance Certificates</h3><p>EPCs for sale, rental and compliance.</p></div><div class="panel"><h3>Engineers' Reports</h3><p>Clear technical reports to support your property decisions.</p></div></div>`;
const views={
home:()=>`<section class="hero"><div class="wrap grid"><div><p class="eyebrow">Family-owned · Malta</p><h1>Carefully planned homes, personally overseen</h1><p>Brothers and business partners combining architecture, engineering and project management to deliver professionally managed residential developments, sold directly with no agent fees.</p><p><a class="btn" href="#/developments">Explore Our Developments</a></p></div><img src="${ph('Hero property image','#4a4130')}" alt="Placeholder property image"></div></section>
<section class="block"><div class="wrap"><p class="eyebrow">What we do</p><h2>Services</h2>${services}</div></section>
<section class="block alt"><div class="wrap"><p class="eyebrow">Portfolio</p><h2>Featured developments</h2>${cards(PROJECTS.slice(0,3))}</div></section>`,
developments:()=>`<section class="block"><div class="wrap"><p class="eyebrow">Portfolio</p><h1>Our Developments</h1><p style="color:var(--muted);max-width:620px">Explore our development and refurbishment projects. Open any project to see its before and after transformation.</p><br>${cards(PROJECTS)}</div></section>`,
about:()=>`<section class="block"><div class="wrap split"><div class="about"><p class="eyebrow">About us</p><h1>A family-owned property developer in Malta</h1>
<p>At NewHome Developments, we are a family-owned property development business in Malta, built on professional expertise and quality workmanship. For the past six years, we have combined our backgrounds in architecture, engineering and project management to deliver carefully planned and professionally managed residential developments.</p>
<p>As brothers and business partners, we take a hands-on approach to every project, bringing together technical knowledge, practical experience and close attention to detail. From the initial planning stages to the final finishes, we oversee the work personally to ensure that each stage meets our standards for quality, organisation and delivery.</p>
<p>We believe that a successful development depends as much on communication and trust as it does on construction. Our clients have direct contact with us throughout the project and after completion, providing a clear point of contact for questions, updates and ongoing support. We take our commitments seriously and work closely with our teams to maintain progress and meet agreed timeframes.</p>
<p>We work with experienced tradespeople who hold the necessary licences and share our commitment to quality workmanship and a high standard of finish. By coordinating each trade and paying attention to the details, we aim to create homes that are well built and comfortable to live in.</p>
<p>Our involvement continues through to a smooth handover for new homeowners and the condominium management company. We take care to support this transition and remain available after completion, helping owners settle into their new homes.</p>
<a class="btn" href="#/contact">Get in Touch</a></div><img src="${ph('About image: replace with your photo','#4a4130')}" alt="Placeholder image for the About page"></div></section><section class="block alt"><div class="wrap"><h2>Our services</h2>${services}</div></section>`,
contact:()=>`<section class="block"><div class="wrap two"><div><p class="eyebrow">Contact</p><h1>Make an enquiry</h1><p>Interested in a new home, a refurbishment, an EPC or an engineer's report? Send us a message.</p><p><strong>Phone:</strong> <a href="tel:+35699992244">99992244</a><br><strong>Email:</strong> [Email address]<br><strong>Location:</strong> Malta</p></div>
<form id="f" class="panel"><label>Name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Phone<input name="phone" type="tel" autocomplete="tel"></label><label>Message<textarea name="msg" rows="5" required>${esc(new URLSearchParams(location.hash.split("?")[1]||"").get("about")||"")}</textarea></label><button class="btn" type="submit">Send Enquiry</button><small id="fs" style="color:var(--muted)"></small></form></div></section>`
};
function project(slug){const p=PROJECTS.find(x=>x.slug===slug);if(!p)return views.developments();
const n=p.notes,row=(b,tag,cl,c)=>`<div class="split"><div><span class="tag ${cl}">${tag}</span><h2>${esc(b.heading)}</h2><p>${esc(b.text)}</p></div><img loading="lazy" src="${img(b.img,b.heading+': '+p.title,c)}" alt="${esc(b.heading)}: ${esc(p.title)}"></div>`;
return `<section class="block"><div class="wrap"><p class="crumb"><a href="#/developments">&larr; All developments</a></p><p class="loc">${esc(p.location)}</p><h1>${esc(p.title)}</h1><p style="max-width:700px;color:var(--muted)">${esc(p.overview)}</p><img src="${img(p.main||p.cover,p.title,'#3a3326')}" alt="Main image of ${esc(p.title)}" style="border-radius:12px;width:100%;margin-top:20px"></div></section>
<section class="block alt"><div class="wrap"><p class="eyebrow">The transformation</p><h2>Before and after</h2>${row(p.before,'Before','', '#6b6f78')}${row(p.after,'After','after','#3a3326')}
<h3 style="text-align:center;margin-top:32px">Compare: drag the slider</h3><div class="slider" id="sl"><img src="${img(p.after.img,'After','#3a3326')}" alt="After"><img class="top" src="${img(p.before.img,'Before','#6b6f78')}" alt="Before"><div class="bar"></div><input type="range" min="0" max="100" value="50" aria-label="Before and after comparison slider"></div></div></section>
<section class="block"><div class="wrap"><p class="eyebrow">For potential clients</p><h2>Project notes</h2><div class="two"><div class="panel"><h3>Improvements completed</h3><ul class="tick">${n.improvements.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><h3 style="margin-top:20px">Key features</h3><ul class="tick">${n.features.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div><div class="panel"><h3>Value and benefits</h3><p>${esc(n.benefits)}</p><h3>Relevant services</h3><ul class="tick">${n.services.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div></div><p style="margin-top:28px"><a class="btn" href="#/contact?about=${encodeURIComponent('I would like to discuss a project like '+p.title)}">Discuss Your Project</a> &nbsp; <a class="btn ghost" href="#/developments">View All Developments</a></p></div></section>`}
function render(){const h=location.hash.replace(/^#\/?/,"").split("?")[0],[r,s]=h.split("/");
const key=["developments","about","contact"].includes(r)?r:r==="project"?"developments":"home";
app.innerHTML=r==="project"?project(s):views[key]();
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===key));
document.getElementById("links").classList.remove("open");
const t=r==="project"&&PROJECTS.find(x=>x.slug===s);document.title=(t?t.title+" | ":key==="home"?"":key[0].toUpperCase()+key.slice(1)+" | ")+SITE.name;
app.classList.remove("view");void app.offsetWidth;app.classList.add("view");scrollTo(0,0);
const sl=document.getElementById("sl");if(sl){const i=sl.querySelector("input");i.oninput=()=>{sl.querySelector(".top").style.clipPath=`inset(0 ${100-i.value}% 0 0)`;sl.querySelector(".bar").style.left=i.value+"%"}}
const f=document.getElementById("f");if(f)f.onsubmit=e=>{e.preventDefault();const d=new FormData(f);location.href=`mailto:${SITE.email}?subject=${encodeURIComponent("Website enquiry from "+d.get("name"))}&body=${encodeURIComponent(d.get("msg")+"\n\n"+d.get("name")+"\n"+d.get("email")+"\n"+d.get("phone"))}`;document.getElementById("fs").textContent="Opening your email app to send the enquiry..."}}
app.addEventListener("click",e=>{const c=e.target.closest("[data-go]");if(c&&!e.target.closest("a"))location.hash="#/project/"+c.dataset.go});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.go)location.hash="#/project/"+e.target.dataset.go});
document.getElementById("menu").onclick=function(){const o=document.getElementById("links").classList.toggle("open");this.setAttribute("aria-expanded",o)};
addEventListener("hashchange",render);render();
</script>
</body>
</html>
